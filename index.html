<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cafe営業カレンダー｜Miraise</title>
<meta name="theme-color" content="#082550">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cafe営業カレンダー">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;background:#f5f5f1;font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f5f1}
  .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#082550;color:#e9d6ad;z-index:5;transition:opacity .4s}
  .splash img{width:120px;height:120px;border-radius:26px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .splash p{margin:0;font-size:13px;letter-spacing:.2em}
  .splash.hide{opacity:0;pointer-events:none}
  [hidden]{display:none !important} /* 非表示の指定を必ず優先（案内が空のまま出続ける不具合の修正） */
  .a2hs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;gap:12px;
    background:#fff;border:1px solid rgba(168,132,74,.6);border-radius:14px;padding:12px 12px 12px 12px;box-shadow:0 8px 24px rgba(8,37,80,.25);max-width:460px;margin:0 auto}
  .a2hs img{width:44px;height:44px;border-radius:10px;flex:none}
  .a2hs .t{flex:1;font-size:12px;line-height:1.6;color:#1f2f8f}
  .a2hs .t b{display:block;font-size:14px}
  .a2hs button{appearance:none;border:0;border-radius:999px;font-family:inherit;font-weight:700;cursor:pointer}
  .a2hs .add{background:#1f2f8f;color:#fff;font-size:13px;padding:9px 14px;white-space:nowrap}
  .a2hs .done{display:block;background:none;color:#8a90a8;font-size:11px;font-weight:600;padding:4px 0 0;text-decoration:underline;text-align:left}
  .a2hs .x{background:none;color:#8a90a8;font-size:20px;line-height:1;padding:4px 6px}
</style>
</head>
<body>
<div class="splash" id="splash"><img src="icon-192.png" alt="Miraise"><p>読み込み中…</p></div>
<iframe id="app" title="Miraise 営業カレンダー"></iframe>
<div class="a2hs" id="a2hs" hidden>
  <img src="icon-192.png" alt="">
  <div class="t" id="a2hsText"></div>
  <button class="add" id="a2hsAdd" hidden>追加する</button>
  <button class="x" id="a2hsClose" aria-label="閉じる">×</button>
</div>
<script>
  /* ▼ ここにApps ScriptのウェブアプリURL（https://script.google.com/macros/s/…/exec）を貼り付けてください */
  const APP_URL = 'https://script.google.com/macros/s/AKfycbwg4QAHx_zjR3o8gjYRAPnjfaMrdoaywfCX5JAE06LRdmnb8n0CtrCAWUI7ZCpbivQf/exec';

  const app = document.getElementById('app');
  const splash = document.getElementById('splash');
  app.addEventListener('load', function () { splash.classList.add('hide'); });
  setTimeout(function () { splash.classList.add('hide'); }, 8000);
  app.src = APP_URL;

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  /* ── ホーム画面への追加の案内 ──
     ・ホーム画面のアプリから開いたときは表示しない
     ・ブラウザで開いたときは、ホーム画面に追加されていなければ表示する
       （Androidはアプリが入っているかを自動で確認。アンインストールすると再び表示）
     ・「×」は3日間、「追加済み」は30日間だけ表示を止める（iPhoneは追加の有無を確認できないため） */
  const ua = navigator.userAgent;
  const params = new URLSearchParams(location.search);
  // ホーム画面のアプリとして起動しているか（アプリ内ブラウザを誤って「アプリ」と判定しないよう、確実な条件だけで判定）
  const standalone = params.get('source') === 'homescreen' || navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
  const isLINE = / Line\//i.test(ua);
  const isAndroid = /Android/i.test(ua);
  const box = document.getElementById('a2hs'), text = document.getElementById('a2hsText'), add = document.getElementById('a2hsAdd');
  const store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  ['a2hs-done', 'a2hs-count', 'a2hs-dismissed'].forEach(store.del); // 旧版の「二度と表示しない」記録を削除
  const mode = params.get('a2hs'); // ?a2hs=reset で表示停止の記録を消す／?a2hs=debug で状態を表示
  function snoozeType() {
    const until = Number(store.get('a2hs-until') || 0);
    return Date.now() < until ? store.get('a2hs-type') : null;
  }
  function snooze(type, days) { store.set('a2hs-type', type); store.set('a2hs-until', String(Date.now() + days * 864e5)); }
  function unsnooze() { store.del('a2hs-type'); store.del('a2hs-until'); }
  if (mode === 'reset' || mode === 'debug') unsnooze();

  let deferred = null, timer = null, shown = false;
  function hide() { box.hidden = true; clearTimeout(timer); }
  function show(html, withButton) {
    if (standalone || shown) return;
    shown = true;
    text.innerHTML = html + '<button class="done" id="a2hsDone">追加済みの方はこちら</button>';
    add.hidden = !withButton; box.hidden = false;
    document.getElementById('a2hsDone').onclick = function () { snooze('done', 30); hide(); };
    timer = setTimeout(hide, 15000);
  }
  const shareIcon = '<svg width="13" height="15" viewBox="0 0 13 15" fill="none" stroke="#1f2f8f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M6.5 1v8.5M3.5 4L6.5 1l3 3"/><path d="M4 6.5H2v7.5h9V6.5H9"/></svg>';
  function guideText() {
    if (isLINE) return '<b>ホーム画面に追加するには</b>右上のメニューから「' + (isIOS ? 'Safari' : 'ブラウザ') + 'で開く」を選んでください';
    if (isIOS) return '<b>ホーム画面に追加</b>画面下の共有ボタン ' + shareIcon + ' から「ホーム画面に追加」を選んでください';
    if (isAndroid) return '<b>ホーム画面に追加</b>右上のメニュー（︙）から「ホーム画面に追加」または「アプリをインストール」を選んでください。見当たらない場合は、先に「Chromeで開く」を選んでください';
    return '';
  }

  // Android（Chrome）：この合図が来る＝まだインストールされていない
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    if (snoozeType() === 'done') unsnooze();      // 「追加済み」だったがアンインストールされた
    if (snoozeType() === 'x') return;
    show('<b>ホーム画面に追加</b>アプリのようにすぐ開けます', true);
  });
  window.addEventListener('appinstalled', function () { hide(); });
  add.onclick = function () {
    if (!deferred) return;
    deferred.prompt();
    deferred = null; hide();
  };
  document.getElementById('a2hsClose').onclick = function () { snooze('x', 3); hide(); };

  function debugInfo(installed) {
    if (mode !== 'debug') return;
    const info = '【確認用】ホーム画面から起動:' + (standalone ? 'はい' : 'いいえ') +
      '／端末:' + (isIOS ? 'iPhone' : isAndroid ? 'Android' : 'その他') + (isLINE ? '（LINE内）' : '') +
      '／追加済み判定:' + installed + '／インストール合図:' + (deferred ? 'あり' : 'なし');
    box.hidden = false; shown = true;
    text.innerHTML = (text.innerHTML || '<b>ホーム画面に追加</b>' + guideText().replace(/^<b>[^<]*<\/b>/, '')) +
      '<small style="display:block;margin-top:6px;color:#b5485d;font-size:10px;line-height:1.5">' + info + '</small>';
  }
  setTimeout(function () {
    if (standalone) { debugInfo('—'); return; }
    if (deferred || shown || snoozeType()) { debugInfo(snoozeType() ? '表示停止中(' + snoozeType() + ')' : '—'); return; }
    const go = function (installed) { const t = guideText(); if (t) show(t, false); debugInfo(installed); };
    if (isAndroid && navigator.getInstalledRelatedApps) {
      navigator.getInstalledRelatedApps().then(function (apps) {
        if (apps && apps.length) { debugInfo('インストール済みと判定'); return; } // インストール済み → 表示しない
        go('未インストール');
      }).catch(function () { go('確認できず'); });
    } else go('確認できない端末');
  }, 2500);
</script>
</body>
</html>
